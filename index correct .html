}

async function yj(u){var r=await fetch(u),d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);return d;}
function yItem(v){var a=document.createElement('a');a.className='yv';a.href='https://www.youtube.com/watch?v='+v.id;a.target='_blank';a.rel='noopener';var im=document.createElement('img');im.src=v.th;im.alt='';var d=document.createElement('div'),s=document.createElement('strong'),p=document.createElement('span');s.textContent=v.t;p.textContent=v.c;d.appendChild(s);d.appendChild(p);a.appendChild(im);a.appendChild(d);return a;}
function ythumb(s){return ((s.thumbnails&&(s.thumbnails.medium||s.thumbnails.default))||{}).url||'';}
async function loadYT(force){var k=lsGet('jv_ykey',''),top=E('ytop'),mine=E('ymine');if(!k){top.textContent='Ajoute ta clé YouTube dans Paramètres.';mine.textContent='';return;}var now=Date.now(),c=null;try{c=JSON.parse(localStorage.getItem('jv_yt_top')||'null');}catch(e){}
 if(!c||force||now-c.t>6048e5){top.textContent='Chargement…';try{var d=await yj('https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=FR&maxResults=50&key='+k),ids=[];d.items.forEach(function(v){if(ids.indexOf(v.snippet.channelId)<0)ids.push(v.snippet.channelId);});var ch=await yj('https://www.googleapis.com/youtube/v3/channels?part=statistics&id='+ids.slice(0,50).join(',')+'&key='+k),subs={};ch.items.forEach(function(x){subs[x.id]=+x.statistics.subscriberCount||0;});c={t:now,l:d.items.filter(function(v){return v.snippet.categoryId!=='10'&&(subs[v.snippet.channelId]||0)>=300000;}).slice(0,10).map(function(v){return {id:v.id,t:v.snippet.title,c:v.snippet.channelTitle,th:ythumb(v.snippet)};})};lsSet('jv_yt_top',JSON.stringify(c));}catch(e){top.textContent='Erreur YouTube : '+e.message;c=null;}}
 if(c){top.innerHTML='';c.l.forEach(function(v){top.appendChild(yItem(v));});if(!c.l.length)top.textContent='Rien à afficher pour l’instant.';}
 var names=lsGet('jv_ych','').split(',').map(function(x){return x.trim();}).filter(Boolean);if(!names.length){mine.textContent='Ajoute des noms de chaînes dans Paramètres.';return;}
 var m=null;try{m=JSON.parse(localStorage.getItem('jv_yt_mine')||'null');}catch(e){}
 if(!m||force||now-m.t>108e5){mine.textContent='Chargement…';try{var idm={};try{idm=JSON.parse(localStorage.getItem('jv_yids')||'{}');}catch(e){}var out=[];for(var i=0;i<names.length;i++){var n=names[i];if(!idm[n]){var s=await yj('https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&maxResults=1&q='+encodeURIComponent(n)+'&key='+k);if(!s.items.length)continue;idm[n]=s.items[0].id.channelId;lsSet('jv_yids',JSON.stringify(idm));}var pl=await yj('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=2&playlistId=UU'+idm[n].slice(2)+'&key='+k);pl.items.forEach(function(x){out.push({id:x.snippet.resourceId.videoId,t:x.snippet.title,c:x.snippet.channelTitle,th:ythumb(x.snippet)});});}m={t:now,l:out};lsSet('jv_yt_mine',JSON.stringify(m));}catch(e){mine.textContent='Erreur YouTube : '+e.message;m=null;}}
 if(m){mine.innerHTML='';m.l.forEach(function(v){mine.appendChild(yItem(v));});if(!m.l.length)mine.textContent='Aucune vidéo trouvée.';}}
